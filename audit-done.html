<title>신청 완료 — 그로스랩 무료 진단</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #171717;
    --body: #4d4d4d;
    --mute: #8f8f8f;
    --hairline: #ebebeb;
    --canvas: #fafafa;
    --elevated: #ffffff;
    --link: #0070f3;
    --g-dev-a: #007cf0; --g-dev-b: #00dfd8;
    --g-pre-a: #7928ca; --g-pre-b: #ff0080;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); color: var(--ink); background: var(--canvas); line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
  .box { max-width: 520px; text-align: center; background: var(--elevated); border: 1px solid var(--hairline); border-radius: 16px; padding: 56px 40px; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
  .eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); }
  h1 { margin-top: 16px; font-size: clamp(26px, 5vw, 34px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.15; }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--g-dev-a), var(--g-pre-a) 55%, var(--g-pre-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 16px; font-size: 15px; line-height: 1.7; color: var(--body); }
  .btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 28px; height: 44px; padding: 0 24px; border-radius: 100px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; text-decoration: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .sub-link { display: block; margin-top: 14px; font-size: 13px; color: var(--link); text-decoration: none; }
  .sub-link:hover { text-decoration: underline; }
</style>

<body>
  <div class="box">
    <div class="eyebrow">Application Received</div>
    <h1>신청이 <em>접수됐습니다</em></h1>
    <p>48시간 내 진단 리포트를 이메일로 보내드립니다.<br>스팸함도 한 번 확인해 주세요.</p>
    <p style="font-size:13px;color:var(--mute)">기다리는 동안, 실제 계정에서 어떻게 일하는지<br>실전기로 먼저 확인할 수 있습니다.</p>

  </div>
</body>
